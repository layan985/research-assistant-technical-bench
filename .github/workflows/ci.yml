name: benchmark-ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy statsmodels scikit-learn reportlab pytest
      - run: python exams/task01_data_wrangle/generate.py
      - run: python exams/task03_event_study/generate.py
      - run: python exams/task06_bug_hunt/generate.py
      - run: pytest -q
