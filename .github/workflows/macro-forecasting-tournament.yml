name: macro-forecasting-tournament

on:
  pull_request:
    paths:
      - "forecast_tournament/**"
      - ".github/workflows/macro-forecasting-tournament.yml"
  push:
    branches: [main]
    paths:
      - "forecast_tournament/**"
      - ".github/workflows/macro-forecasting-tournament.yml"
  workflow_dispatch:
    inputs:
      live_run:
        description: "Download ALFRED/FRED vintages and build the real leaderboard"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecast_tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast_tournament/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  live-tournament:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_run }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: forecast_tournament
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Require FRED API key
        run: test -n "$FRED_API_KEY" || (echo "Set repository secret FRED_API_KEY before a live run" && exit 1)
      - name: Download frozen vintage database
        run: macro-tournament download --config config/us_monthly.yml --output data/vintages.csv
      - name: Run full tournament
        run: macro-tournament run --config config/us_monthly.yml --data data/vintages.csv --output-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: macro-forecasting-results
          path: |
            forecast_tournament/results/*.csv
            forecast_tournament/results/*.md
          if-no-files-found: error
