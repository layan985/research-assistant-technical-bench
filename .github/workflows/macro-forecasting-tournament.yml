name: macro-forecasting-tournament

# Live forecasts require explicit manual dispatch after the first sealed run.
on:
  pull_request:
    paths:
      - "forecast_tournament/**"
      - ".github/workflows/macro-forecasting-tournament.yml"
  workflow_dispatch:
    inputs:
      live_run:
        description: "Download ALFRED/FRED vintages and build the real leaderboard"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecast_tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast_tournament/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  prepare-data:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_run }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      enabled: ${{ steps.live_gate.outputs.enabled }}
    defaults:
      run:
        working-directory: forecast_tournament
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check live-run credential
        id: live_gate
        shell: bash
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live tournament skipped::Repository secret FRED_API_KEY is not configured; no empirical rankings were generated."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "FRED_API_KEY is configured; executing the explicitly dispatched frozen protocol."
          fi
      - uses: actions/setup-python@v5
        if: steps.live_gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        if: steps.live_gate.outputs.enabled == 'true'
      - name: Download frozen vintage database
        if: steps.live_gate.outputs.enabled == 'true'
        run: macro-tournament download --config config/us_monthly.yml --output data/vintages.csv
      - uses: actions/upload-artifact@v4
        if: steps.live_gate.outputs.enabled == 'true'
        with:
          name: macro-vintage-database
          path: forecast_tournament/data/vintages.csv
          if-no-files-found: error

  forecast-shards:
    if: ${{ needs.prepare-data.outputs.enabled == 'true' }}
    needs: prepare-data
    strategy:
      fail-fast: false
      matrix:
        target: [CPIAUCSL, UNRATE, INDPRO]
        horizon: [1, 3, 6, 12]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: forecast_tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast_tournament/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: macro-vintage-database
          path: forecast_tournament/data
      - name: Run frozen target-horizon shard
        run: >-
          macro-tournament run
          --config config/us_monthly.yml
          --data data/vintages.csv
          --output-dir shard_results
          --target "${{ matrix.target }}"
          --horizon ${{ matrix.horizon }}
          --forecasts-only
      - name: Give shard a unique immutable filename
        run: mv shard_results/forecasts.csv "shard_results/forecasts-${{ matrix.target }}-${{ matrix.horizon }}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: macro-forecast-shard-${{ matrix.target }}-${{ matrix.horizon }}
          path: forecast_tournament/shard_results/forecasts-${{ matrix.target }}-${{ matrix.horizon }}.csv
          if-no-files-found: error

  collect-results:
    if: ${{ needs.prepare-data.outputs.enabled == 'true' }}
    needs: [prepare-data, forecast-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forecast_tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast_tournament/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: macro-vintage-database
          path: forecast_tournament/data
      - uses: actions/download-artifact@v4
        with:
          pattern: macro-forecast-shard-*
          path: forecast_tournament/shards
          merge-multiple: true
      - name: Combine forecast ledger and build frozen evaluation tables
        run: >-
          macro-tournament finalize
          --config config/us_monthly.yml
          --data data/vintages.csv
          --forecasts-dir shards
          --output-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: macro-forecasting-results
          path: |
            forecast_tournament/results/*.csv
            forecast_tournament/results/*.md
            forecast_tournament/results/*.json
            forecast_tournament/results/*.yml
          if-no-files-found: error
