name: finalize-sealed-macro-run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-sealed-macro-run.yml"

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forecast_tournament
    steps:
      - name: Checkout exact v1.0.2 evaluation commit
        uses: actions/checkout@v4
        with:
          ref: f7820ac5a9d16126f2e637372e1c81540200bcfc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast_tournament/pyproject.toml
      - name: Install protocol-v1.0.2 evaluator
        run: python -m pip install -e ".[dev]"
      - name: Download sealed vintage database from canonical forecast run
        uses: actions/download-artifact@v4
        with:
          name: macro-vintage-database
          path: forecast_tournament/data
          run-id: 31324910141
          github-token: ${{ github.token }}
      - name: Download all 12 sealed forecast shards from canonical forecast run
        uses: actions/download-artifact@v4
        with:
          pattern: macro-forecast-shard-*
          path: forecast_tournament/shards
          merge-multiple: true
          run-id: 31324910141
          github-token: ${{ github.token }}
      - name: Build paired-origin v1.0.2 tables from sealed forecasts
        env:
          FORECAST_SOURCE_SHA: ba5cbcb974802ac258fc3c7da3204a4a7a7fc318
        run: >-
          env -u GITHUB_SHA macro-tournament finalize
          --config config/us_monthly.yml
          --data data/vintages.csv
          --forecasts-dir shards
          --output-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: macro-forecasting-results-v1.0.2
          path: |
            forecast_tournament/results/*.csv
            forecast_tournament/results/*.md
            forecast_tournament/results/*.json
            forecast_tournament/results/*.yml
          if-no-files-found: error
